<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Finance Ledger Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Poppins, system-ui, sans-serif;
        background: #f3f6fb;
        color: #101c2f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(23, 59, 122, 0.14), transparent 34%),
          #f3f6fb;
      }

      main {
        width: min(92vw, 480px);
        padding: 2rem;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(23, 59, 122, 0.12);
        box-shadow: 0 24px 60px -38px rgba(8, 17, 31, 0.42);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.875rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Finance Ledger is offline</h1>
      <p>
        Your app shell is available, and any finance data already stored in this browser
        stays available. Reconnect when you can and pending changes will sync again.
      </p>
    </main>
  </body>
</html>
